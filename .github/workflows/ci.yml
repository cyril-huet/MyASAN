name: MyASAN CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Run 100 tests
        run: make CC=${{ matrix.compiler }} test
      - name: Rebuild from scratch
        run: make CC=${{ matrix.compiler }} re

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with Apple Clang
        run: make CC=clang test

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check MyASAN with ASan and UBSan
        run: make CC=clang sanitize
